<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>うんちインクリメンタル（開発版）</title>
<style>
:root{--bg:#fff1c9;--fg:#3b2a1a;--panel:#ffffff;--line:#3b2a1a;--hi:#ff5fa2}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;box-sizing:border-box}
h1{margin:0 0 8px;font-size:1.5rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
#r{font-size:.8rem;font-weight:normal;display:block;width:100%;color:#6b5a44}
#app{flex:1;min-height:0;width:100%;max-width:1440px;max-height:810px;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
#toggleUI{margin-left:auto;font-size:.85rem;padding:8px 14px}
#pauseBtn{font-size:.85rem;padding:8px 14px}

#clockRow{display:flex;justify-content:center;flex-shrink:0;margin:2px 0}
#clockRow.hide{visibility:hidden}
#pixClock{font-family:"Courier New",monospace;font-weight:bold;letter-spacing:2px;
  background:#1c120a;color:#ffd23f;padding:4px 14px;font-size:1.3rem;
  border-image-source:url(ui/panel_brown.png);border-image-slice:10 fill;border-image-width:8px;border-style:solid;
  image-rendering:pixelated;text-shadow:0 0 4px #ffb02e}
#pixClock .lbl{font-size:.6rem;letter-spacing:1px;display:block;color:#e8c9a0;text-align:center;font-family:"Yu Gothic",sans-serif}
.grp{margin-top:10px;
  border-image-source:url(ui/panel_slate.png);border-image-slice:10 fill;border-image-width:10px;
  image-rendering:pixelated;padding:2px}
.grp>summary{cursor:pointer;padding:8px 10px;font-weight:bold;display:flex;justify-content:space-between;color:#eef3f6;text-shadow:1px 1px 0 #1c2b33}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:8px}
button{font:inherit;color:var(--fg);cursor:pointer;text-align:left;padding:10px 8px;
  border:none;background-color:transparent;
  border-image-source:url(ui/panel_cream.png);border-image-slice:10 fill;border-image-width:10px;
  image-rendering:pixelated}
button:disabled{opacity:.45;cursor:default}
button:not(:disabled):hover{filter:brightness(1.08)}
.unlock{border-image-source:url(ui/panel_brown.png);color:#fff6e4;text-shadow:1px 1px 0 #5a3414}
.asc{border-image-source:url(ui/panel_brown.png);filter:hue-rotate(-45deg) saturate(1.6);color:#fff6e4;text-shadow:1px 1px 0 #5a3414}
.sub{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.sub button{font-size:.8rem;text-align:center}

.overlay{position:fixed;inset:0;background:rgba(20,14,8,.6);z-index:1000;overflow-y:auto;padding:16px;display:flex;justify-content:center}
.overlay.hidden{display:none}
.overlay-inner{max-width:960px;width:100%}
#closeUI{margin-bottom:12px;font-size:.9rem;padding:10px 16px}

#bossBar{display:none;width:100%;max-width:960px;margin:4px auto 0;flex-shrink:0}
#bossBar.show{display:block}
#bossBarTrack{background:#2a1b10;border:2px solid var(--line);height:16px;border-radius:2px;overflow:hidden}
#bossBarFill{background:linear-gradient(#b23cff,#6a1ab0);height:100%;width:100%;transition:width .2s}
#bossBarLabel{font-size:.75rem;color:#6b5a44;margin-top:2px}

.result-card{max-width:560px;margin:60px auto;text-align:center;
  background:var(--bg);color:var(--fg);padding:20px;border-radius:4px;
  border-image-source:url(ui/panel_cream.png);border-image-slice:10 fill;border-image-width:10px;border-style:solid;image-rendering:pixelated}
.result-card h2{margin-bottom:4px}
.result-card .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:16px}

#titleOverlay{z-index:2000}
#titleOverlay h1{font-size:2rem;justify-content:center;text-shadow:2px 2px 0 #c98a3a}
#titleOverlay .result-card{margin-top:100px}
.opt-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0}
.opt-row input[type=range]{width:200px}
</style>
</head>
<body>
<main>
<h1>
  うんP <span id="p">0</span>
  <button id="pauseBtn">⏸ 一時停止</button>
  <button id="toggleUI">スキルツリーへ</button>
  <span id="r"></span>
</h1>
<div id="clockRow">
  <div id="pixClock"><span class="lbl">NEXT BOSS</span>20:00</div>
</div>
<div id="bossBar">
  <div id="bossBarTrack"><div id="bossBarFill"></div></div>
  <div id="bossBarLabel"></div>
</div>
<div id="app"></div>
</main>

<div id="overlay" class="overlay hidden">
  <div class="overlay-inner">
    <button id="closeUI">✕ フィールドへ戻る</button>
    <div id="groups"></div>
    <div class="sub">
      <button id="cheat">テスト用 +5000うんP</button>
      <button id="skipboss">テスト用 ボス戦へ即移行</button>
      <button id="reset">データ消去</button>
    </div>
  </div>
</div>

<div id="resultOverlay" class="overlay hidden"><div class="result-card" id="resultInner"></div></div>
<div id="victoryOverlay" class="overlay hidden"><div class="result-card" id="victoryInner"></div></div>
<div id="pauseOverlay" class="overlay hidden"><div class="result-card" id="pauseInner"></div></div>
<div id="titleOverlay" class="overlay"><div class="result-card" id="titleInner"></div></div>
<div id="optionsOverlay" class="overlay hidden"><div class="result-card" id="optionsInner"></div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
